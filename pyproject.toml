[project]
name = "fashion-mnist-deep-learning-project"
version = "0.1.0"
description = "Fashion-MNIST deep learning image classification project"
readme = "README.md"
authors = [
    { name = "Rishii", email = "arishiraj1415@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
